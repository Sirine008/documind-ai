name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind_ci_password
          POSTGRES_DB: documind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U documind -d documind_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOCUMIND_TEST_DATABASE_URL: postgresql+psycopg://documind:documind_ci_password@localhost:5432/documind_test
      DOCUMIND_DATABASE_URL: postgresql+psycopg://documind:documind_ci_password@localhost:5432/documind_test
      DOCUMIND_EMBEDDING_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Check that sample documents are reproducible
        run: |
          python scripts/generate_sample_docs.py
          git diff --exit-code -- data/sample_documents/home_coffee_brewing_guide.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Check migration round-trip
        working-directory: backend
        run: alembic downgrade base && alembic upgrade head
      - name: Run tests (unit + database)
        working-directory: backend
        run: pytest -m "not external"
      - name: Seed demo data and run retrieval evaluation
        run: |
          python scripts/seed_demo.py
          python scripts/evaluate_rag.py --no-store

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker configuration and image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci docker compose config --quiet
      - name: Build backend image (without ML extras, to keep CI fast)
        run: docker build -f backend/Dockerfile --build-arg INSTALL_ML=false -t documind-backend:ci .
      - name: Build frontend image
        run: docker build -t documind-frontend:ci frontend
