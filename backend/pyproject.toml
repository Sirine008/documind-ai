[project]
name = "documind-ai-backend"
version = "0.1.0"
description = "DocuMind AI backend: document ingestion, hybrid retrieval and grounded question answering"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a running PostgreSQL database with pgvector (DOCUMIND_TEST_DATABASE_URL)",
    "external: requires a real external LLM provider and API key",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pymupdf.*"]
